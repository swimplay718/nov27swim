/* v8 - Full width tile grid and device safe-area accommodation */
html,body{width:100%;min-height:100%;margin:0;}
body{padding:0;align-items:flex-start;justify-content:center;}
.shell{box-sizing:border-box;width:min(100%,540px);padding:0!important;margin:0 auto;}
.game{width:100%;margin:0;border:0!important;border-radius:0;overflow:hidden;box-shadow:none;}
.game>canvas{display:block;width:100%;height:auto;aspect-ratio:440/690;image-rendering:pixelated;}
/* Controls stay inside the safe area, even on notch / dynamic-island phones. */
.game>.hud{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;}
.game>.timer{top:calc(92px + env(safe-area-inset-top,0px));}
@media(max-width:420px){
 .game>.hud{top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;}
 .game>.timer{top:calc(86px + env(safe-area-inset-top,0px));}
}
.qa-controls{padding-bottom:max(10px,env(safe-area-inset-bottom,0px));}

/* v9: fully opaque pixel HUD backing blocks in-game objects from showing through */
.game::before{
  content:"";
  position:absolute;
  z-index:1;
  top:0;
  left:0;
  right:0;
  height:calc(112px + env(safe-area-inset-top, 0px));
  background:#8cae83;
  pointer-events:none;
}
.game > .hud{z-index:2;}
.game > .timer{z-index:2;}
.game > .overlay{z-index:8;}
/* Make HUD panels truly opaque even if prior rules used alpha/translucency */
.game .chip{background:#f2e5bd;backdrop-filter:none;}
.game .chip-height{background:#e9eec5;}
.game .chip-pieces{background:#f2e5bd;}
@media(max-width:420px){
  .game::before{height:calc(106px + env(safe-area-inset-top, 0px));}
}

/* v13: continuous tile/HUD edges, no overlap, responsive iPhone safe areas */

/* v25: native design baseline 1179x2556 physical px = 393x852 CSS px @3x.
   Preserve the ratio of each standalone sprite and shrink the HUD rather than enlarging its images. */
:root{
 --design-width:393;
 --design-height:852;
 --ui-card-height:clamp(57px, 19.1vw, 88px);
 --ui-hp-height:clamp(29px, 8.6vw, 40px);
 --ui-web-height:clamp(35px, 10.2vw, 48px);
}
html,body{width:100%!important;min-height:100%!important;overflow:hidden!important;}
.shell{
 width:min(100vw, 480px)!important;
 max-width:480px!important;
 height:var(--view-height,100dvh)!important;
 margin-inline:auto!important;
}
.game{
 height:100%!important;
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)!important;
 gap:0!important;
}
.game>.hud.pixel-hud{
 display:grid!important;
 grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
 align-items:stretch!important;
 flex:0 0 var(--ui-card-height)!important;
 height:var(--ui-card-height)!important;
 min-height:0!important;
 padding:0 3px!important;
 gap:2px!important;
 box-sizing:border-box!important;
}
.game>.hud.pixel-hud>.pixel-progress-card{
 width:100%!important;
 min-width:0!important;
 height:100%!important;
 max-height:100%!important;
 aspect-ratio:auto!important;
 flex:none!important;
 background-size:100% 100%!important;
 background-position:center center!important;
 image-rendering:pixelated!important;
}
.game>.hud.pixel-hud .pixel-progress-value{
 top:75%!important;
 font-size:clamp(13px,3.9vw,19px)!important;
}
.game>.health-strip.pixel-hp{
 flex:0 0 var(--ui-hp-height)!important;
 height:var(--ui-hp-height)!important;
 min-height:0!important;
 max-height:var(--ui-hp-height)!important;
 aspect-ratio:auto!important;
 background-size:100% 100%!important;
}
.game>.health-strip.pixel-hp .pixel-hp-value{
 top:51%!important;
 left:27%!important;
 font-size:clamp(11px,3.1vw,15px)!important;
}
.game>.health-strip.pixel-hp .health-track{
 top:36%!important;
 height:34%!important;
}
.game>.timer.pixel-web{
 flex:0 0 var(--ui-web-height)!important;
 height:var(--ui-web-height)!important;
 min-height:0!important;
 max-height:var(--ui-web-height)!important;
 aspect-ratio:auto!important;
 background-size:100% 100%!important;
}
.game>.timer.pixel-web #bar{top:41%!important;height:24%!important;}
.game>canvas{
 order:3!important;
 flex:1 1 0!important;
 height:0!important;
 min-height:0!important;
 width:100%!important;
 object-fit:fill!important;
}
@media(max-height:690px){
 :root{--ui-card-height:clamp(50px,16vw,73px);--ui-hp-height:clamp(25px,7vw,33px);--ui-web-height:clamp(31px,8vw,40px);}
}
@media(min-width:481px){
 :root{--ui-card-height:88px;--ui-hp-height:40px;--ui-web-height:48px;}
}

/* v26: consistent 2px-pixel HUD; icons are crisp SVG pixel sprites, text and progress are live DOM */
:root{--ui-card-height:clamp(72px,20vw,90px);--ui-hp-height:clamp(40px,10.8vw,46px);--ui-web-height:clamp(36px,9.8vw,43px);}
.game>.hud.pixel-hud{
  flex:0 0 var(--ui-card-height)!important;height:var(--ui-card-height)!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:6px!important;padding:5px 8px 3px!important;background:#93a937!important;
}
.game>.hud.pixel-hud>.pixel-progress-card{
  position:relative!important;display:flex!important;flex-direction:column!important;
  align-items:center!important;justify-content:center!important;
  aspect-ratio:auto!important;min-width:0!important;height:100%!important;
  padding:5px 7px 6px!important;background-image:none!important;
  background:#f1e7c8!important;border:3px solid #624e35!important;
  box-shadow:inset 0 0 0 3px #96b46c,inset 0 0 0 5px #faf4d9,0 3px 0 #4c7150!important;
  image-rendering:auto!important;
}

.hp-label{display:flex;align-items:center;flex:none;gap:4px;white-space:nowrap;color:#a94554;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;font-weight:900;font-size:clamp(12px,3.2vw,15px);letter-spacing:-.02em;}

/* v27: align HUD precisely with seven-column tile wall, match gauge tracks */
:root{--map-edge:0.68%;--meter-label-width:clamp(122px,33vw,153px)}
.game>.hud.pixel-hud{
  box-sizing:border-box!important;
  width:calc(100% - 1.36%)!important;
  margin-left:var(--map-edge)!important;
  margin-right:var(--map-edge)!important;
  padding:3px 0 3px!important;
  gap:4px!important;
  align-self:center!important;
}
.game>.health-strip.pixel-hp,
.game>.timer.pixel-web{
  box-sizing:border-box!important;
  width:calc(100% - 1.36%)!important;
  margin-left:var(--map-edge)!important;
  margin-right:var(--map-edge)!important;
  padding:5px 8px!important;
  gap:6px!important;
  align-self:center!important;
}
.game>.health-strip.pixel-hp .hp-label,
.game>.timer.pixel-web .web-label{
  box-sizing:border-box!important;
  width:var(--meter-label-width)!important;
  flex:0 0 var(--meter-label-width)!important;
  min-width:0!important;
  justify-content:flex-start!important;
  font-size:clamp(10px,2.9vw,14px)!important;
  gap:3px!important;
}
.game>.health-strip.pixel-hp .hp-label svg,
.game>.timer.pixel-web .web-label svg{
  width:20px!important;height:20px!important;flex:none!important;
}
.game>.health-strip.pixel-hp .health-track,
.game>.timer.pixel-web .web-track{
  box-sizing:border-box!important;
  width:auto!important;
  flex:1 1 0!important;
  min-width:0!important;
  height:18px!important;
  margin:0!important;
  overflow:hidden!important;
}
.game>.timer.pixel-web #bar{
  display:block!important;
  position:absolute!important;
  inset:0 auto 0 0!important;
  width:100%;height:100%!important;
  min-width:0!important;max-width:none!important;
  transform:none!important;
  transition:width .08s linear!important;
  will-change:width;
}
@media(max-width:360px){:root{--meter-label-width:clamp(112px,32vw,125px)}}

/* v31: HP and web strips share size, gauge start position and gauge size; % readout removed */

.game>.health-strip.pixel-hp .health-track,.game>.timer.pixel-web .web-track{left:32.09%!important;top:32.5%!important;width:59.79%!important;height:35%!important}

/* v34: pixel-font labels replace baked image text; all UI text unified at 14px */
.pixel-progress-card::before,.game>.health-strip.pixel-hp::before,.game>.timer.pixel-web::before{position:absolute;z-index:2;white-space:nowrap;font-size:14px!important;line-height:1;color:#3b2a1d;text-shadow:1px 0 0 #3b2a1d;pointer-events:none}

.pixel-progress-card.pixel-letters::before{content:"편지 조각";left:60.5%;top:31%;transform:translate(-50%,-50%)}
.game>.health-strip.pixel-hp::before{content:"체력";left:14.4%;top:47%;transform:translateY(-50%)}
.game>.timer.pixel-web::before{content:"실 발사";left:14.4%;top:47%;transform:translateY(-50%)}
.pixel-count-window b,.game>.hud.pixel-hud .pixel-progress-value{font-size:14px!important}
